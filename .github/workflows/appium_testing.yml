name: Rootio - 4. Appium Mobile Application Testing Suite

on:
  workflow_dispatch:
  push:
    paths:
      - 'qa/appium_testing/**'
      - 'qa/common/**'

jobs:
  run-appium-tests:
    name: Execute Appium Testing (300 Test Cases)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install QA Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Rootio Appium Automation Suite
        run: |
          python qa/appium_testing/run_appium_tests.py

      - name: Upload Appium Testing Excel Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rootio_Appium_Testing_Report
          path: qa/reports/Rootio_Appium_Testing_Report.xlsx
          if-no-files-found: error
          retention-days: 30
