name: Rootio - 4. Appium Mobile Application Testing Suite

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-appium-tests:
    name: Run Appium Mobile Application Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install QA Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get update && sudo apt-get install -y jq

      - name: Run Rootio Appium Automation Suite
        run: python qa/appium_testing/run_appium_tests.py

      - name: Upload Appium Testing Excel Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Rootio_Appium_Testing_Report
          path: qa/reports/Rootio_Appium_Testing_Report.xlsx
          if-no-files-found: error
          retention-days: 30

      - name: Generate Job Summary Chart
        if: always()
        run: |
          SUMMARY_JSON="qa/reports/appium_summary.json"
          if [ -f "$SUMMARY_JSON" ]; then
            TOTAL=$(jq -r '.total' "$SUMMARY_JSON")
            PASSED=$(jq -r '.passed' "$SUMMARY_JSON")
            FAILED=$(jq -r '.failed' "$SUMMARY_JSON")
            PASSRATE=$(jq -r '.passRate' "$SUMMARY_JSON")
            DURATION=$(jq -r '.duration' "$SUMMARY_JSON")
            STATUS=$(jq -r '.status' "$SUMMARY_JSON")
            
            echo "## 📊 Rootio — Appium Mobile Test Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`mermaid" >> $GITHUB_STEP_SUMMARY
            echo "pie title Mobile Appium Pass vs Fail Rate ($PASSRATE%)" >> $GITHUB_STEP_SUMMARY
            echo "    \"Passed ✅\" : $PASSED" >> $GITHUB_STEP_SUMMARY
            echo "    \"Failed ❌\" : $FAILED" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 🔄 Mobile Testing Execution Flow" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`mermaid" >> $GITHUB_STEP_SUMMARY
            echo "graph TD" >> $GITHUB_STEP_SUMMARY
            echo "    Start([Start Run]) --> AppLifecycle[Validate Mobile Cold Start & Backgrounding]" >> $GITHUB_STEP_SUMMARY
            echo "    AppLifecycle --> Gestures[Test Swipe-to-Delete & Photo Pinch-Zoom]" >> $GITHUB_STEP_SUMMARY
            echo "    Gestures --> Permissions[Verify Camera & Storage Runtime Permissions]" >> $GITHUB_STEP_SUMMARY
            echo "    Permissions --> OfflineMode[Test Airplane Mode & Offline Firestore Sync]" >> $GITHUB_STEP_SUMMARY
            echo "    OfflineMode --> BackNav[Verify Android Hardware Back Button Unwinding]" >> $GITHUB_STEP_SUMMARY
            echo "    BackNav --> ResourceProfile[Profile CPU, Thermal Throttling & Battery]" >> $GITHUB_STEP_SUMMARY
            echo "    ResourceProfile --> GenerateReports[Generate Excel & Summary JSON]" >> $GITHUB_STEP_SUMMARY
            echo "    GenerateReports --> UploadExcel[Upload Excel Report Artifact]" >> $GITHUB_STEP_SUMMARY
            echo "    UploadExcel --> End([End Run])" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| **Total Test Cases** | $TOTAL |" >> $GITHUB_STEP_SUMMARY
            echo "| **Passed ✅** | $PASSED |" >> $GITHUB_STEP_SUMMARY
            echo "| **Failed ❌** | $FAILED |" >> $GITHUB_STEP_SUMMARY
            echo "| **Success Rate 📈** | $PASSRATE% |" >> $GITHUB_STEP_SUMMARY
            echo "| **Total Duration ⏱️** | ${DURATION}s |" >> $GITHUB_STEP_SUMMARY
            echo "| **Mobile Readiness 📱** | $STATUS |" >> $GITHUB_STEP_SUMMARY
          fi
