      - uses: actions/upload-artifact@v4
        with:
          name: Rootio_Vulnerability_Testing_Report
          path: qa/reports/Rootio_Vulnerability_Testing_Report.xlsx

  selenium-tests:
    name: 3. Selenium Testing (300 Cases)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
