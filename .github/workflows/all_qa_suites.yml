name: Rootio - Run All QA Test Suites (Master)

on:
  workflow_dispatch:

jobs:
  load-tests:
    name: 1. Load Testing (300 Cases)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python qa/load_testing/run_load_tests.py
      - uses: actions/upload-artifact@v4
        with:
          name: Rootio_Load_Testing_Report
          path: qa/reports/Rootio_Load_Testing_Report.xlsx

  vulnerability-tests:
    name: 2. Vulnerability Testing (300 Cases)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
