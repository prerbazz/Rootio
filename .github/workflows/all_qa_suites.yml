          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python qa/selenium_testing/run_selenium_tests.py
      - uses: actions/upload-artifact@v4
        with:
          name: Rootio_Selenium_Testing_Report
          path: qa/reports/Rootio_Selenium_Testing_Report.xlsx

  appium-tests:
    name: 4. Appium Testing (300 Cases)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python qa/appium_testing/run_appium_tests.py
      - uses: actions/upload-artifact@v4
        with:
          name: Rootio_Appium_Testing_Report
          path: qa/reports/Rootio_Appium_Testing_Report.xlsx
