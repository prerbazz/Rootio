name: Rootio - 3. Selenium Web Automation Testing Suite

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-selenium-tests:
    name: Run Selenium E2E Web Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install QA Dependencies & Chrome
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable jq

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Flutter Web App
        run: flutter build web --release

      - name: Run Rootio Selenium Automation Suite
        run: python qa/selenium_testing/run_selenium_tests.py

      - name: Upload Selenium Testing Excel Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Rootio_Selenium_Testing_Report
          path: qa/reports/Rootio_Selenium_Testing_Report.xlsx
          if-no-files-found: error
          retention-days: 30

      - name: Generate Job Summary Chart
        if: always()
        run: |
          SUMMARY_JSON="qa/reports/selenium_summary.json"
          if [ -f "$SUMMARY_JSON" ]; then
            TOTAL=$(jq -r '.total' "$SUMMARY_JSON")
            PASSED=$(jq -r '.passed' "$SUMMARY_JSON")
            FAILED=$(jq -r '.failed' "$SUMMARY_JSON")
            PASSRATE=$(jq -r '.passRate' "$SUMMARY_JSON")
            DURATION=$(jq -r '.duration' "$SUMMARY_JSON")
            STATUS=$(jq -r '.status' "$SUMMARY_JSON")
            
            echo "## 📊 Rootio — Selenium Web Test Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`mermaid" >> $GITHUB_STEP_SUMMARY
            echo "pie title Rootio Web Test Pass vs Fail Rate ($PASSRATE%)" >> $GITHUB_STEP_SUMMARY
            echo "    \"Passed ✅\" : $PASSED" >> $GITHUB_STEP_SUMMARY
            echo "    \"Failed ❌\" : $FAILED" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 🔄 Webdriver Execution Flow" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`mermaid" >> $GITHUB_STEP_SUMMARY
            echo "graph TD" >> $GITHUB_STEP_SUMMARY
            echo "    Start([Start Run]) --> Checkout[Checkout Repo]" >> $GITHUB_STEP_SUMMARY
            echo "    Checkout --> SetupFlutter[Setup Flutter SDK]" >> $GITHUB_STEP_SUMMARY
            echo "    SetupFlutter --> BuildWeb[Build Web Application]" >> $GITHUB_STEP_SUMMARY
            echo "    BuildWeb --> StartServer[Start Local Server :8080]" >> $GITHUB_STEP_SUMMARY
            echo "    StartServer --> RunSelenium[Run Headless Chrome Selenium Tests]" >> $GITHUB_STEP_SUMMARY
            echo "    RunSelenium --> GenerateArtifacts[Generate Excel & Summary JSON]" >> $GITHUB_STEP_SUMMARY
            echo "    GenerateArtifacts --> UploadExcel[Upload Excel Report Artifact]" >> $GITHUB_STEP_SUMMARY
            echo "    UploadExcel --> End([End Run])" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| **Total Test Cases** | $TOTAL |" >> $GITHUB_STEP_SUMMARY
            echo "| **Passed ✅** | $PASSED |" >> $GITHUB_STEP_SUMMARY
            echo "| **Failed ❌** | $FAILED |" >> $GITHUB_STEP_SUMMARY
            echo "| **Success Rate 📈** | $PASSRATE% |" >> $GITHUB_STEP_SUMMARY
            echo "| **Total Duration ⏱️** | ${DURATION}s |" >> $GITHUB_STEP_SUMMARY
            echo "| **Release Readiness 🚀** | $STATUS |" >> $GITHUB_STEP_SUMMARY
          fi
