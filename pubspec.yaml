name: rootio
description: Rootio - Intelligent Farming Companion App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Fonts
  google_fonts: ^6.1.0
  percent_indicator: ^4.2.3

  # State Management
  provider: ^6.1.1

  # Firebase Core
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1
  firebase_storage: ^12.1.3

  # Media & Storage
  image_picker: ^1.0.4
  shared_preferences: ^2.2.2

  # Networking (for Gemini AI)
  http: ^1.2.1

  # Utilities
  intl: ^0.18.1
  google_sign_in: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
